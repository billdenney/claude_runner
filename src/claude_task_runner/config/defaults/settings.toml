# claude_task_runner default settings.
#
# Per-queue overrides live in <queue>/claude_runner.toml and are merged on top
# of these defaults. See ADR-0014: every cutoff is a setting.

# ---------------------------------------------------------------------------
# Claude CLI invocation
# ---------------------------------------------------------------------------
[claude]
executable = "claude"
config_dir = ""        # CLAUDE_CONFIG_DIR override; empty = use ~/.claude.
                       # Set to e.g. "/home/bill/.claude_personal" to target
                       # a non-default account whose `claude /login` was run
                       # under that dir. Lets one host run multiple accounts.

# ---------------------------------------------------------------------------
# Usage capture & parser
# ---------------------------------------------------------------------------
[usage]
capture_trust_timeout_s     = 10        # Phase 1: trust prompt vs TUI ready
capture_usage_timeout_s     = 15        # Phase 2: await two Resets lines
capture_eof_timeout_s       = 5
capture_post_ready_pad_ms   = 1500      # delay after "shortcuts" before /usage
capture_post_data_pad_ms    = 4000      # delay after 2nd Resets so OAuth response lands
capture_rotation_count      = 200       # raw .cap files retained
poll_interval_s             = 60        # supervisor ticks
healthcheck_interval_s      = 3600      # standalone drift canary
suspicious_delta_pct        = 50        # flag if util jumps > N points between polls
drift_recovery_clean_polls  = 3         # consecutive clean polls to leave ErrorDrift

# ---------------------------------------------------------------------------
# Throttle: global time-of-day boundaries
#
# Operator-active hours (06:00-22:00 local) get tighter dispatch caps so
# interactive work has token headroom; the runner pushes harder at night.
# The 30-minute ramp at each boundary avoids whipsawing dispatch at the
# clock edge. See ADR-0015 for the math.
#
# Set `timezone = ""` to use the system local timezone.
# ---------------------------------------------------------------------------
[throttle.time_of_day]
timezone     = ""        # IANA name (e.g. "America/New_York"); "" = system local
day_start    = "06:00"   # HH:MM 24h — inclusive start of core daytime
day_end      = "22:00"   # HH:MM 24h — exclusive end of core daytime
ramp_minutes = 30        # linear interpolation width at each boundary

# ---------------------------------------------------------------------------
# Throttle: 5-hour window
#
# Static `band_*` thresholds apply when the daytime/nighttime overrides
# below are unset. With the overrides set, the supervisor uses
# `daytime_band_*` during 06:00-22:00 and `nighttime_band_*` overnight,
# interpolating across the configured ramp. ADR-0015.
# ---------------------------------------------------------------------------
[throttle.five_hour]
budget_tokens               = 99_000_000   # Max20x 5h ceiling
band_full_dispatch_max_pct  = 70           # static fallback (used when day/night overrides unset)
band_slowdown_max_pct       = 90           # >= 90% : no new dispatch (Throttled5h)
# Time-of-day overrides: tighter during day, looser at night.
# Target ~22% average 5h utilization across 168h => ~95% weekly cap by reset.
daytime_band_full_dispatch_max_pct   = 15  # tight daytime: leave 85% headroom for interactive
daytime_band_slowdown_max_pct        = 30
nighttime_band_full_dispatch_max_pct = 50  # push at night while operator is AFK
nighttime_band_slowdown_max_pct      = 75

# ---------------------------------------------------------------------------
# Throttle: weekly window
#
# Two pacers operate on weekly utilization:
#
# 1. Static bands (`band_*`, `pause_at_pct`) — hard safety floor.
# 2. Dynamic pacing curve (`pacing_curve_enabled`) — when ON, the supervisor
#    computes a target utilization curve from the weekly elapsed fraction
#    (anchored to the OAuth-reported `resets_at`, NOT a fixed weekday) and
#    shifts the effective bands by how far observed deviates from target,
#    outside a `pacing_slack_pp` dead-band. Ahead of target → tighter
#    bands; behind target → looser bands. ADR-0016.
#
# `eow_target_pct` lowered 98 → 95: leaves a 5pp safety margin so a sudden
# burst near reset doesn't trip the hard pause.
# `eow_window_s` widened 43_200 (12h) → 86_400 (24h): more opportunities
# for nighttime EOW push (which is gated to nighttime in the state machine
# so daytime 5h windows stay free for interactive use).
# ---------------------------------------------------------------------------
[throttle.weekly]
budget_tokens               = 798_841_951  # Max20x weekly ceiling
band_full_dispatch_max_pct  = 70
band_slowdown_max_pct       = 90
pause_at_pct                = 90
eow_push_enter_at_pct       = 90
eow_target_pct              = 95           # was 98 — leave safety margin
eow_window_s                = 86400        # 24h — was 43200 (12h)
eow_runtime_safety_factor   = 0.5
# Dynamic pacing curve. ADR-0016.
pacing_curve_enabled        = true
pre_eow_target_pct          = 80           # target % at start of EOW window
pacing_slack_pp             = 10.0         # dead-band ±N pp around target curve

# ---------------------------------------------------------------------------
# Concurrency / EMA
# ---------------------------------------------------------------------------
[concurrency]
max_concurrency             = 2
initial_concurrency         = 1

[ema]
alpha                       = 0.3
prior_warmup_samples        = 3
runtime_p90_multiplier      = 1.5

# Conservative cold-start priors per (model, effort). Override per queue.
[ema.priors."claude-opus-4-7".low]
tokens                      = 1_500_000
duration_s                  = 600

[ema.priors."claude-opus-4-7".medium]
tokens                      = 2_500_000
duration_s                  = 1200

[ema.priors."claude-opus-4-7".high]
tokens                      = 3_000_000
duration_s                  = 1800

[ema.priors."claude-opus-4-7".max]
tokens                      = 6_000_000
duration_s                  = 3600

[ema.priors."claude-opus-4-7".extra_high]
tokens                      = 10_000_000
duration_s                  = 7200

[ema.priors."claude-sonnet-4-6".medium]
tokens                      = 1_000_000
duration_s                  = 600

[ema.priors."claude-haiku-4-5".medium]
tokens                      = 500_000
duration_s                  = 300

# ---------------------------------------------------------------------------
# Effort levels per model (varies; updated as Anthropic adds/removes levels)
# ---------------------------------------------------------------------------
[effort_levels]
"claude-opus-4-7"   = ["low", "medium", "high", "max", "extra_high"]
"claude-sonnet-4-6" = ["low", "medium", "high"]
"claude-haiku-4-5"  = ["low", "medium", "high"]

# ---------------------------------------------------------------------------
# Session resume
# ---------------------------------------------------------------------------
[session]
max_resume_attempts         = 3
resume_fail_fast_s          = 5

# ---------------------------------------------------------------------------
# Failure classifier (extensible via TOML)
# ---------------------------------------------------------------------------
[failure_classifier]
environmental_patterns = [
    "you've hit your limit",
    "hit your org",
    "monthly usage limit",
    "api returned http 5",
    "is_error=true",
    "stream-json reported",
    "TimeoutExpired",
    "timed out",
    "ConnectionError",
    "ECONNRESET",
    "connection reset",
    "connection refused",
]
operator_patterns = [
    "Operator: defer",
    "Abort: only the abstract",
    "permanently",
    "operator-deferred",
]
task_patterns = []
failure_circuit_breaker_threshold = 3

# ---------------------------------------------------------------------------
# Per-task safety caps
# ---------------------------------------------------------------------------
[task_caps]
max_tokens_per_task         = 0          # 0 = unlimited
max_duration_s_per_task     = 14400      # 4h per attempt; 0 = unlimited
heartbeat_silence_alert_s   = 300        # mark possibly_hung after N s of silence
heartbeat_silence_kill_s    = 0          # 0 = never auto-kill

# ---------------------------------------------------------------------------
# Watchdog (cron / systemd)
# ---------------------------------------------------------------------------
[watchdog]
restart_cooldown_s          = 30
restart_backoff_max_s       = 600
crash_loop_threshold        = 5

# ---------------------------------------------------------------------------
# Supervisor scheduling
# ---------------------------------------------------------------------------
[supervisor]
window_start_delay_s        = 300        # cron fires N s after detected window reset
state_file                  = "supervisor.json"
sigterm_grace_s             = 30
dry_run                     = false
preferred_init_system       = "auto"     # auto | systemd | cron

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
[notify]
channels                    = ["desktop"]
desktop_command             = "notify-send"
file_path                   = "~/.claude_task_runner/banner.txt"
webhook_url                 = ""
email_to                    = ""

# ---------------------------------------------------------------------------
# Pre/post-dispatch hooks
# ---------------------------------------------------------------------------
[hooks]
pre_dispatch_command        = ""
pre_dispatch_timeout_s      = 120
post_dispatch_command       = ""
post_dispatch_timeout_s     = 60

# ---------------------------------------------------------------------------
# Sidecars
# ---------------------------------------------------------------------------
[sidecar]
unanswered_alert_s            = 86400    # re-emit notification after N s pending
unanswered_auto_recommended_s = 0        # 0 = never auto-pick

# ---------------------------------------------------------------------------
# Metrics / observability
# ---------------------------------------------------------------------------
[metrics]
prometheus_enabled       = false
prometheus_textfile_path = "/var/lib/node_exporter/textfile_collector/claude_task_runner.prom"

# ---------------------------------------------------------------------------
# Terminal UI
# ---------------------------------------------------------------------------
[ui]
refresh_interval_ms = 1000

# ---------------------------------------------------------------------------
# Fixture corpus rotation
# ---------------------------------------------------------------------------
[fixtures]
rotation_window_days = 30
