# claude_task_runner default settings.
#
# Per-queue overrides live in <queue>/claude_runner.toml and are merged on top
# of these defaults. See ADR-0014: every cutoff is a setting.

# ---------------------------------------------------------------------------
# Claude CLI invocation
# ---------------------------------------------------------------------------
[claude]
executable = "claude"
config_dir = ""        # CLAUDE_CONFIG_DIR override; empty = use ~/.claude.
                       # Set to e.g. "/home/bill/.claude_personal" to target
                       # a non-default account whose `claude /login` was run
                       # under that dir. Lets one host run multiple accounts.
plan       = "max20x"  # Claude plan: "max20x" | "max5x" | "pro" | "team".
                       # Determines the 5h:weekly token ratio used to derive
                       # default throttle thresholds. Operator can still
                       # override `[throttle.*]` fields explicitly below.
                       # If empty / unrecognised, the explicit `[throttle.*]`
                       # values are used as-is (no auto-tuning).

# ---------------------------------------------------------------------------
# Usage capture & parser
# ---------------------------------------------------------------------------
[usage]
capture_trust_timeout_s     = 10        # Phase 1: trust prompt vs TUI ready
capture_usage_timeout_s     = 15        # Phase 2: await two Resets lines
capture_eof_timeout_s       = 5
capture_post_ready_pad_ms   = 1500      # delay after "shortcuts" before /usage
capture_post_data_pad_ms    = 4000      # delay after 2nd Resets so OAuth response lands
capture_rotation_count      = 200       # raw .cap files retained
poll_interval_s             = 60        # supervisor ticks
healthcheck_interval_s      = 3600      # standalone drift canary
suspicious_delta_pct        = 50        # flag if util jumps > N points between polls
drift_recovery_clean_polls  = 3         # consecutive clean polls to leave ErrorDrift

# ---------------------------------------------------------------------------
# Throttle: 5-hour window
#
# Tightened thresholds 2026-05-11 to pace 5h consumption against the
# weekly cap. Rationale: on Max plans the 5h budget is roughly 1/8 of
# the weekly budget, so 8 back-to-back 100%-utilised 5h sessions
# exhausts weekly in ~40h vs the 168h weekly window. Capping 5h at
# 60% leaves headroom for the operator's interactive use AND spreads
# autonomous queue runtime across the full week.
#
# Plan-specific tuning: future versions will derive these from
# `[claude].plan` against a per-plan budget table; for now the
# defaults below are tuned for Max20x and are inherited unchanged
# by other plans. Per-queue `claude_runner.toml` can still override
# any of these explicitly.
# ---------------------------------------------------------------------------
[throttle.five_hour]
budget_tokens               = 99_000_000   # Max20x 5h ceiling
band_full_dispatch_max_pct  = 40           # < 40% : full target concurrency
band_slowdown_max_pct       = 60           # 40-60% : linear slowdown
                                           # >= 60% : no new dispatch (Throttled5h)

# ---------------------------------------------------------------------------
# Throttle: weekly window
#
# Weekly thresholds left looser than 5h since the weekly cap is the
# hard ceiling rather than the per-session pacer. The 5h throttle is
# what spreads consumption across the week.
# ---------------------------------------------------------------------------
[throttle.weekly]
budget_tokens               = 798_841_951  # Max20x weekly ceiling
band_full_dispatch_max_pct  = 70
band_slowdown_max_pct       = 90
pause_at_pct                = 90
eow_push_enter_at_pct       = 90
eow_target_pct              = 98
eow_window_s                = 43200      # 12h
eow_runtime_safety_factor   = 0.5

# ---------------------------------------------------------------------------
# Plan-specific budget table
#
# Reserved for forthcoming auto-tuning: when `[claude].plan` is one
# of the keys below, the loader replaces `[throttle.five_hour].budget_tokens`
# and `[throttle.weekly].budget_tokens` with the plan's values, and
# (if the operator hasn't overridden them) replaces the band_*_max_pct
# fields with values derived from the plan's 5h:weekly ratio.
#
# Current rows are approximate ceilings observed on each plan; verify
# against `claude /usage` for the target account before relying on them.
# The schema validator does not enforce these — they're informational
# until the loader implements the auto-tuning.
# ---------------------------------------------------------------------------
[plans.max20x]
five_hour_tokens = 99_000_000
weekly_tokens    = 798_841_951
# Eight 5h windows per week of budget; 168h / (8 windows × 5h) = 4.2x
# spare capacity, so cap 5h at ~60% to spread across the week.
band_full_dispatch_max_pct = 40
band_slowdown_max_pct      = 60

[plans.max5x]
five_hour_tokens = 24_750_000     # ~1/4 of Max20x
weekly_tokens    = 199_710_488
band_full_dispatch_max_pct = 40
band_slowdown_max_pct      = 60

[plans.pro]
five_hour_tokens = 4_950_000      # ~1/20 of Max20x
weekly_tokens    = 39_942_098
band_full_dispatch_max_pct = 40
band_slowdown_max_pct      = 60

[plans.team]
# Team plan budgets vary by org; treat as Max20x-equivalent until
# operator overrides. Use `claude /usage` against the work account
# to calibrate.
five_hour_tokens = 99_000_000
weekly_tokens    = 798_841_951
band_full_dispatch_max_pct = 40
band_slowdown_max_pct      = 60

# ---------------------------------------------------------------------------
# Concurrency / EMA
# ---------------------------------------------------------------------------
[concurrency]
max_concurrency             = 2
initial_concurrency         = 1

[ema]
alpha                       = 0.3
prior_warmup_samples        = 3
runtime_p90_multiplier      = 1.5

# Conservative cold-start priors per (model, effort). Override per queue.
[ema.priors."claude-opus-4-7".low]
tokens                      = 1_500_000
duration_s                  = 600

[ema.priors."claude-opus-4-7".medium]
tokens                      = 2_500_000
duration_s                  = 1200

[ema.priors."claude-opus-4-7".high]
tokens                      = 3_000_000
duration_s                  = 1800

[ema.priors."claude-opus-4-7".max]
tokens                      = 6_000_000
duration_s                  = 3600

[ema.priors."claude-opus-4-7".extra_high]
tokens                      = 10_000_000
duration_s                  = 7200

[ema.priors."claude-sonnet-4-6".medium]
tokens                      = 1_000_000
duration_s                  = 600

[ema.priors."claude-haiku-4-5".medium]
tokens                      = 500_000
duration_s                  = 300

# ---------------------------------------------------------------------------
# Effort levels per model (varies; updated as Anthropic adds/removes levels)
# ---------------------------------------------------------------------------
[effort_levels]
"claude-opus-4-7"   = ["low", "medium", "high", "max", "extra_high"]
"claude-sonnet-4-6" = ["low", "medium", "high"]
"claude-haiku-4-5"  = ["low", "medium", "high"]

# ---------------------------------------------------------------------------
# Session resume
# ---------------------------------------------------------------------------
[session]
max_resume_attempts         = 3
resume_fail_fast_s          = 5

# ---------------------------------------------------------------------------
# Failure classifier (extensible via TOML)
# ---------------------------------------------------------------------------
[failure_classifier]
environmental_patterns = [
    "you've hit your limit",
    "hit your org",
    "monthly usage limit",
    "api returned http 5",
    "is_error=true",
    "stream-json reported",
    "TimeoutExpired",
    "timed out",
    "ConnectionError",
    "ECONNRESET",
    "connection reset",
    "connection refused",
]
operator_patterns = [
    "Operator: defer",
    "Abort: only the abstract",
    "permanently",
    "operator-deferred",
]
task_patterns = []
failure_circuit_breaker_threshold = 3

# ---------------------------------------------------------------------------
# Per-task safety caps
# ---------------------------------------------------------------------------
[task_caps]
max_tokens_per_task         = 0          # 0 = unlimited
max_duration_s_per_task     = 14400      # 4h per attempt; 0 = unlimited
heartbeat_silence_alert_s   = 300        # mark possibly_hung after N s of silence
heartbeat_silence_kill_s    = 0          # 0 = never auto-kill

# ---------------------------------------------------------------------------
# Watchdog (cron / systemd)
# ---------------------------------------------------------------------------
[watchdog]
restart_cooldown_s          = 30
restart_backoff_max_s       = 600
crash_loop_threshold        = 5

# ---------------------------------------------------------------------------
# Supervisor scheduling
# ---------------------------------------------------------------------------
[supervisor]
window_start_delay_s        = 300        # cron fires N s after detected window reset
state_file                  = "supervisor.json"
sigterm_grace_s             = 30
dry_run                     = false
preferred_init_system       = "auto"     # auto | systemd | cron

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
[notify]
channels                    = ["desktop"]
desktop_command             = "notify-send"
file_path                   = "~/.claude_task_runner/banner.txt"
webhook_url                 = ""
email_to                    = ""

# ---------------------------------------------------------------------------
# Pre/post-dispatch hooks
# ---------------------------------------------------------------------------
[hooks]
pre_dispatch_command        = ""
pre_dispatch_timeout_s      = 120
post_dispatch_command       = ""
post_dispatch_timeout_s     = 60

# ---------------------------------------------------------------------------
# Sidecars
# ---------------------------------------------------------------------------
[sidecar]
unanswered_alert_s            = 86400    # re-emit notification after N s pending
unanswered_auto_recommended_s = 0        # 0 = never auto-pick

# ---------------------------------------------------------------------------
# Metrics / observability
# ---------------------------------------------------------------------------
[metrics]
prometheus_enabled       = false
prometheus_textfile_path = "/var/lib/node_exporter/textfile_collector/claude_task_runner.prom"

# ---------------------------------------------------------------------------
# Terminal UI
# ---------------------------------------------------------------------------
[ui]
refresh_interval_ms = 1000

# ---------------------------------------------------------------------------
# Fixture corpus rotation
# ---------------------------------------------------------------------------
[fixtures]
rotation_window_days = 30
