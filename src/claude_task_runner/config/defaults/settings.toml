# claude_task_runner default settings.
#
# Per-queue overrides live in <queue>/claude_runner.toml and are merged on top
# of these defaults. See ADR-0014: every cutoff is a setting.

# ---------------------------------------------------------------------------
# Claude CLI invocation
# ---------------------------------------------------------------------------
[claude]
executable = "claude"
config_dir = ""        # LEGACY single-account alias; superseded by [[accounts]]
                       # below. Empty = ``~/.claude``. When [[accounts]] is set
                       # explicitly, this field is ignored (the doctor command
                       # emits a WARN). Operators with a bare [claude] block
                       # keep working: the loader synthesises a single account
                       # named "default" from this field.
plan       = "max20x"  # Claude plan: "max20x" | "max5x" | "pro" |
                       # "team_standard" | "team_premium".
                       # Determines the 5h:weekly token ratio used to derive
                       # default throttle thresholds. Operator can still
                       # override `[throttle.*]` fields explicitly below.
                       # If empty / unrecognised, the explicit `[throttle.*]`
                       # values are used as-is (no auto-tuning).

# ---------------------------------------------------------------------------
# Claude accounts (multi-account dispatch)
#
# One [[accounts]] block per Claude billing identity the supervisor may
# dispatch through. When omitted entirely, the loader synthesises a single
# account named "default" from the legacy [claude].config_dir field — bare
# single-account configs from before multi-account dispatch keep working.
#
# Each block requires only `name` (filesystem- and shell-safe) and
# `config_dir` (the CLAUDE_CONFIG_DIR populated by `claude /login`), plus
# an optional `linux_user` for multi-user spawning. Per-account dispatch
# policy (max_concurrency, throttle bands, time-of-day) lives INSIDE each
# account's own config dir at:
#
#   <config_dir>/runner-account.toml
#
# That keeps each account owner in control of their own limits — useful
# when accounts belong to different people or billing entities. A missing
# per-account file defaults to max_concurrency=1 with the standard 40/60
# daytime + 70/90 nighttime bands.
#
# Dispatch policy: all accounts equal priority. The dispatcher picks the
# least-utilized account (by 5h utilization, tie-broken by weekly util
# then name) when multiple have free capacity. There is no queue-wide
# concurrency cap — operators choose per-account caps such that their
# sum is acceptable.
#
# Example two-account setup (personal + work; work runs under a separate
# Linux user for audit clarity):
#
#   [[accounts]]
#   name = "personal"
#   config_dir = "/home/bill/.claude_personal"
#
#   [[accounts]]
#   name = "work"
#   config_dir = "/home/bill-work/.claude"
#   linux_user = "bill-work"
#
# Each account's own runner-account.toml then carries:
#
#   [concurrency]
#   max_concurrency = 5
#
#   [throttle.five_hour]
#   daytime_band_full_dispatch_max_pct   = 40
#   daytime_band_slowdown_max_pct        = 60
#   nighttime_band_full_dispatch_max_pct = 70
#   nighttime_band_slowdown_max_pct      = 90
#
#   [throttle.time_of_day]
#   day_end = "21:00"
#
# Account names appear in supervisor logs, the per-run state YAML's
# RunRecord.account field, and the `claude-task-runner account` CLI.
# Tasks may pin to a specific account by setting `account: <name>` in
# their task YAML; unset means "dispatcher picks the least-utilized
# account with free capacity".
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Usage capture & parser
#
# `source` selects how the supervisor obtains usage readings:
#   * "tty"          — spawn `claude /usage` and parse the TUI.
#                      Slow (10-30s/capture) but reads exactly what
#                      the operator sees. Default; preserves all
#                      historical behaviour.
#   * "api"          — read rate-limit headers from a minimal
#                      /v1/messages call (~500ms, ~4 tokens). Faster
#                      but the headers are reverse-engineered and the
#                      OAuth bearer can expire.
#   * "api_then_tty" — API path first; on auth-expired / missing-
#                      header / network failure, fall through to TTY
#                      for that one capture. The TTY fall-through
#                      refreshes the OAuth bearer as a side effect,
#                      so the next tick returns to the API path.
#                      Recommended once API readings have been
#                      validated to match TTY for the operator's plan.
# ---------------------------------------------------------------------------
[usage]
source                      = "tty"     # "tty" | "api" | "api_then_tty"
api_timeout_s               = 10        # per-request HTTP timeout for the API source
api_probe_model             = "claude-haiku-4-5"  # cheapest model for the probe call
capture_trust_timeout_s     = 10        # Phase 1: trust prompt vs TUI ready
capture_usage_timeout_s     = 15        # Phase 2: await two Resets lines
capture_eof_timeout_s       = 5
capture_post_ready_pad_ms   = 1500      # delay after "shortcuts" before /usage
capture_post_data_pad_ms    = 4000      # delay after 2nd Resets so OAuth response lands
capture_rotation_count      = 200       # raw .cap files retained
poll_interval_s             = 60        # supervisor ticks
healthcheck_interval_s      = 3600      # standalone drift canary
suspicious_delta_pct        = 50        # flag if util jumps > N points between polls
drift_recovery_clean_polls  = 3         # consecutive clean polls to leave ErrorDrift

# ---------------------------------------------------------------------------
# Dispatch percentages (ADR-0022 — variant-C trace-following)
#
# Two pictures the operator can hold in mind:
#
# 1. 5h side — day/night step function. At any local time, dispatch is
#    in DISPATCHING below `fivehr_slowdown_pct`, in SLOWING_DOWN with a
#    linear concurrency ramp between slowdown and stop, and in
#    THROTTLED_5H at or above `fivehr_stop_pct`. Day vs. night is a
#    hard step at the boundaries (`night.time_start` / `night.time_end`).
#    Night may wrap midnight (start > end) or not (start < end).
#
# 2. Weekly side — single sloped target line. From 0 at week start
#    rising to `early_pct` at the EOW elbow (`eow_time_switch` before
#    week reset), then steeper to `eow_pct` at reset. Observed > target
#    ⇒ THROTTLED_WEEKLY; else weekly allows dispatch.
# ---------------------------------------------------------------------------
[dispatch_pct]
timezone = ""             # IANA name (e.g. "America/New_York"); "" = system local

[dispatch_pct.day]
fivehr_slowdown_pct = 40  # < 40% : full dispatch
fivehr_stop_pct     = 60  # 40-60% : linear slowdown; >= 60% : no new dispatch

[dispatch_pct.night]
fivehr_slowdown_pct = 70  # looser at night while operator is AFK
fivehr_stop_pct     = 90
time_start          = "21:00"   # night begins at 21:00 local
time_end            = "06:00"   # night ends at 06:00 local (wraps midnight)

[dispatch_pct.week]
early_pct       = 60          # target % at start of EOW segment
eow_pct         = 95          # target % at week reset
eow_time_switch = "40h"       # length of EOW segment (~2 nights)

# ---------------------------------------------------------------------------
# Plan-specific token budgets
#
# When `[claude].plan` is one of the keys below, the loader uses the
# plan's `five_hour_tokens` and `weekly_tokens` as the source of truth
# for the supervisor's window budgets. Dispatch shape lives entirely in
# `[dispatch_pct.*]` (ADR-0022); plans no longer carry band hints.
#
# Rows are approximate ceilings observed on each plan; verify against
# `claude /usage` for the target account before relying on them.
# ---------------------------------------------------------------------------
[plans.max20x]
five_hour_tokens = 99_000_000
weekly_tokens    = 798_841_951

[plans.max5x]
five_hour_tokens = 24_750_000     # ~1/4 of Max20x
weekly_tokens    = 199_710_488

[plans.pro]
five_hour_tokens = 4_950_000      # ~1/20 of Max20x
weekly_tokens    = 39_942_098

[plans.team_standard]
# Team Standard: operator-noted ratio 1.25 x Pro.
five_hour_tokens = 6_187_500
weekly_tokens    = 49_927_622

[plans.team_premium]
# Team Premium: operator-noted ratio 6.25 x Pro.
five_hour_tokens = 30_937_500
weekly_tokens    = 249_638_112

# ---------------------------------------------------------------------------
# Concurrency / EMA
# ---------------------------------------------------------------------------
[concurrency]
max_concurrency             = 2
initial_concurrency         = 1

[ema]
alpha                       = 0.3
prior_warmup_samples        = 3
runtime_p90_multiplier      = 1.5

# Conservative cold-start priors per (model, effort). Override per queue.
[ema.priors."claude-opus-5".low]
tokens                      = 1_500_000
duration_s                  = 600

[ema.priors."claude-opus-5".medium]
tokens                      = 2_500_000
duration_s                  = 1200

[ema.priors."claude-opus-5".high]
tokens                      = 3_000_000
duration_s                  = 1800

[ema.priors."claude-opus-5".max]
tokens                      = 6_000_000
duration_s                  = 3600

[ema.priors."claude-opus-5".extra_high]
tokens                      = 10_000_000
duration_s                  = 7200

[ema.priors."claude-sonnet-5".medium]
tokens                      = 1_000_000
duration_s                  = 600

[ema.priors."claude-opus-4-7".low]
tokens                      = 1_500_000
duration_s                  = 600

[ema.priors."claude-opus-4-7".medium]
tokens                      = 2_500_000
duration_s                  = 1200

[ema.priors."claude-opus-4-7".high]
tokens                      = 3_000_000
duration_s                  = 1800

[ema.priors."claude-opus-4-7".max]
tokens                      = 6_000_000
duration_s                  = 3600

[ema.priors."claude-opus-4-7".extra_high]
tokens                      = 10_000_000
duration_s                  = 7200

[ema.priors."claude-sonnet-4-6".medium]
tokens                      = 1_000_000
duration_s                  = 600

[ema.priors."claude-haiku-4-5".medium]
tokens                      = 500_000
duration_s                  = 300

# ---------------------------------------------------------------------------
# Effort levels per model (varies; updated as Anthropic adds/removes levels)
# ---------------------------------------------------------------------------
[effort_levels]
"claude-opus-5"     = ["low", "medium", "high", "max", "extra_high"]
"claude-sonnet-5"   = ["low", "medium", "high"]
"claude-haiku-4-5"  = ["low", "medium", "high"]
# Previous-generation models retained so queues with in-flight task YAMLs
# that still name them keep dispatching instead of raising UnknownModel.
"claude-opus-4-7"   = ["low", "medium", "high", "max", "extra_high"]
"claude-sonnet-4-6" = ["low", "medium", "high"]

# ---------------------------------------------------------------------------
# Session resume
# ---------------------------------------------------------------------------
[session]
max_resume_attempts         = 3
resume_fail_fast_s          = 5

# ---------------------------------------------------------------------------
# Failure classifier (extensible via TOML)
# ---------------------------------------------------------------------------
[failure_classifier]
environmental_patterns = [
    "you've hit your limit",
    "hit your org",
    "monthly usage limit",
    "api returned http 5",
    "is_error=true",
    "stream-json reported",
    "TimeoutExpired",
    "timed out",
    "ConnectionError",
    "ECONNRESET",
    "connection reset",
    "connection refused",
    # ADR-0024: cross-account session resume. The orchestrator avoids
    # this case proactively via session affinity, but a state YAML
    # written before that fix (or any other transient reason the
    # session isn't on the resuming account) can still surface here.
    # The fix is to clear session_id (queue restart-fresh) and dispatch
    # fresh; auto-retry buys the next tick where the orchestrator
    # picks the affined account or the operator's restart-fresh lands.
    "No conversation found with session ID",
]
operator_patterns = [
    "Operator: defer",
    "Abort: only the abstract",
    "permanently",
    "operator-deferred",
]
task_patterns = []
failure_circuit_breaker_threshold = 3
# ADR-0027: give up (failed_circuit_breaker, stop_reason sidecar_refile_loop)
# after this many consecutive sidecar re-files with no commit in between.
# A run that commits resets the counter. Stops the answered-sidecar ->
# re-dispatch -> re-file-same-blocker loop.
sidecar_refile_loop_threshold = 4

# ---------------------------------------------------------------------------
# Per-task safety caps
# ---------------------------------------------------------------------------
[task_caps]
max_tokens_per_task              = 0     # 0 = unlimited
max_duration_s_per_task          = 14400 # 4h per attempt; 0 = unlimited
heartbeat_silence_alert_s        = 300   # mark possibly_hung after N s of silence
heartbeat_silence_kill_s         = 0     # 0 = never auto-kill
heartbeat_persist_interval_s     = 30    # min s between in-loop heartbeat YAML writes
steady_state_reap_interval_ticks = 1     # 1 = run per-tick silent-orphan reaper every tick
stuck_sleep_loop_kill_threshold_s = 600  # agent silent > N s (default 10 min) before a descendant sleep-loop is killed; keep above any legitimate bounded poll
bash_poll_antipattern_kill       = true  # master switch: /proc-walk detection of stuck sleep-loop descendants (until!pgrep / while![-e marker] / for...sleep / broad fallback) when agent is silent + monitor alive

# ---------------------------------------------------------------------------
# Watchdog (cron / systemd)
# ---------------------------------------------------------------------------
[watchdog]
restart_cooldown_s          = 30
restart_backoff_max_s       = 600
crash_loop_threshold        = 5

# ---------------------------------------------------------------------------
# Supervisor scheduling
# ---------------------------------------------------------------------------
[supervisor]
window_start_delay_s        = 300        # cron fires N s after detected window reset
state_file                  = "supervisor.json"
preferred_init_system       = "auto"     # auto | systemd | cron
adopt_workers               = true       # ADR-0025: file-backed workers; adopt survivors on restart, fast stop
quarantine_corrupt_state    = true       # ADR-0028: quarantine unparseable state YAMLs -> task reverts to pending

# ---------------------------------------------------------------------------
# Pre/post-dispatch hooks
# ---------------------------------------------------------------------------
[hooks]
pre_dispatch_command        = ""
pre_dispatch_timeout_s      = 120
post_dispatch_command       = ""
post_dispatch_timeout_s     = 60

# ---------------------------------------------------------------------------
# Logging
#
# The supervisor's log records flow through structlog processors and are
# emitted to stderr — systemd's user service captures stderr into the
# journal automatically, so `journalctl --user -u claude-task-runner -f`
# shows live supervisor activity (dispatch decisions, throttle
# transitions, /usage capture timings).
#
#   level   stdlib level name: DEBUG / INFO / WARNING / ERROR.
#           INFO is the operator default; bump to DEBUG to track a
#           specific dispatch's lifecycle.
#   format  "text" = timestamped key=value lines (journalctl-friendly).
#           "json" = one JSON object per record (log-shipper friendly).
# ---------------------------------------------------------------------------
[logging]
level  = "INFO"
format = "text"

# ---------------------------------------------------------------------------
# Queue authoring (`claude-task-runner queue add`)
#
# Per-queue knobs the `queue add` command consults when writing a new task
# YAML. Operators with a pre-dispatch hook that consumes `working_dir`
# (e.g. the nlmixr2lib popPK ingestion hook that creates a per-task git
# worktree) set `working_dir_template` so the convention is encoded once
# in `claude_runner.toml` rather than re-typed (or forgotten) at every
# `queue add` invocation. See ADR-0023.
#
#   working_dir_template
#       Template for new tasks' `working_dir` field. Supports a single
#       `{task_id}` substitution. Empty (the default) preserves the
#       historical behavior: `queue add` writes `working_dir: null`,
#       leaving the field to be populated by hand. Example:
#
#         working_dir_template = "/path/to/repo/.claude/worktrees/{task_id}"
#
#       The operator can still override per task:
#       * `--working-dir <path>`     — use this path explicitly
#       * `--no-working-dir`         — force null (some tasks legitimately
#                                      don't want a worktree, e.g. queue
#                                      categorization shards)
#
#       Tasks already in `todo/` aren't retroactively updated; use
#       `claude-task-runner queue backfill-working-dir --queue <dir>`
#       to fill `working_dir: null` entries idempotently.
# ---------------------------------------------------------------------------
[queue]
working_dir_template = ""

# ---------------------------------------------------------------------------
# Dispatch-time sandbox scope (`--add-dir` propagation)
#
# Claude Code sandboxes each session to its `cwd` by default. Reading or
# writing paths outside cwd is blocked unless `--add-dir <path>` extends
# the allowed scope. The runner always passes `--add-dir <queue_dir>`
# automatically so dispatched agents can reach the queue's papers/,
# sidecar/, and reports/ subtrees. Per-task `additional_dirs` in the
# YAML are honoured too.
#
# `auto_detect_paths_in_prompt` is a power-user knob: when ON, the
# dispatcher scans the prompt text for absolute paths and adds the
# ones that resolve to existing directories. Useful for queues whose
# prompts inline source paths; off by default because absolute-path
# strings in prose are not always directories (false positives).
#
# `dispatch_block_file` (ADR-0029) is an opt-in dispatch block-list,
# relative to the queue dir. When set (e.g. "needs_acquisition.jsonl"),
# the candidate selector skips any task whose id appears in a JSONL
# entry marked `"block_dispatch": true` — WITHOUT spawning a dispatch a
# pre-dispatch hook would only exit-1 defer. This stops a known-blocked
# task (a paper awaiting a supplement, an upstream dependency, ...) from
# burning a dispatch+defer cycle every `deferral_recheck_cooldown_s`,
# which on a low-`max_concurrency` account briefly re-occupies the only
# slot each cooldown. Fail-safe: a missing file / malformed line / row
# without the flag means "not blocked" — the task dispatches and the
# hook enforces the block, so a broken list never strands work. Unset
# (the default) disables the feature; queues without the convention are
# unaffected.
# ---------------------------------------------------------------------------
[dispatch]
auto_detect_paths_in_prompt = false
# dispatch_block_file = "needs_acquisition.jsonl"
