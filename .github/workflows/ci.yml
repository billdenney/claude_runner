name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ui]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest, no live tests)
        env:
          CTR_RUN_LIVE_TESTS: "0"
        # Global coverage gate: 90% line+branch. Hit by 2026-05-16 after
        # adding 227 new tests for the previously-thin operator surface
        # (cli.supervisor_cmd, cli.usage_cmd, cli.sidecar_cmd extras,
        # cli.queue_cmd extras, cli.install_cmd, cli.install_skills_cmd,
        # doctor.checks, runner.orchestrator helpers, supervisor.daemon
        # pure helpers, usage.source).
        #
        # Remaining gaps below the gate are deliberately exempted:
        #   * usage.capture.py — pexpect-driven TUI capture; requires a
        #     real ``claude`` binary, intentionally untested per the
        #     "no external services" testing policy.
        #   * supervisor.daemon.start_daemon — the actual event loop;
        #     covered by the integration test in
        #     tests/integration/test_supervisor_loop.py rather than
        #     line-level unit coverage.
        run: pytest -m "not live" --cov --cov-report=xml --cov-fail-under=90

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  drift-canary:
    # Nightly run with a fake `claude` shim that emits a known fixture.
    # Catches parser regressions even without a real `claude` binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Drift canary against fake claude shim
        env:
          PATH: ${{ github.workspace }}/tests/fixtures/claude_shim:${{ env.PATH }}
        run: pytest tests/integration/test_drift_canary.py -v
